name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK release
        run: gradle assembleRelease -PrunNumber=${{ github.run_number }} -PrepoSlug=${{ github.repository }} --no-daemon

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "TerrariaServer-$VER.apk"
          gh release create "v$VER" "TerrariaServer-$VER.apk" \
            --title "Terraria Server $VER" \
            --notes "Build automatica $VER (commit ${GITHUB_SHA::7})." \
            --target "${{ github.sha }}"
