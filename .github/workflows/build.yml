name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK release
        run: gradle assembleRelease -PrunNumber=${{ github.run_number }} -PrepoSlug=${{ github.repository }} --no-daemon

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.0.${{ github.run_number }}"
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::APK nao encontrado"; exit 1; fi
          cp "$APK" "TerrariaServer-$VER.apk"
          if ! OUT=$(gh release create "v$VER" "TerrariaServer-$VER.apk" --repo "${{ github.repository }}" --title "Terraria Server $VER" --notes "Build automatica $VER" --target "${{ github.sha }}" 2>&1); then
            echo "::error::$(echo "$OUT" | tr '\n' ' ')"
            exit 1
          fi
          echo "$OUT"
