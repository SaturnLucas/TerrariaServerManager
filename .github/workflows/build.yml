name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK release
        run: |
          set +e
          gradle assembleRelease -PrunNumber=${{ github.run_number }} -PrepoSlug=${{ github.repository }} --no-daemon --console=plain > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|error: |What went wrong|AAPT|Execution failed|not found|cannot find|Resource|Caused by" -A2 build.log | grep -v "^--$" | head -30 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            exit $STATUS
          fi

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.0.${{ github.run_number }}"
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::APK nao encontrado"; exit 1; fi
          cp "$APK" "TerrariaServer-$VER.apk"
          OK=0
          for i in 1 2 3 4 5 6; do
            gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
              gh release create "v$VER" --repo "${{ github.repository }}" --title "Terraria Server $VER" --notes "Build automatica $VER" --target "${{ github.sha }}" || true
            if gh release upload "v$VER" "TerrariaServer-$VER.apk" --clobber --repo "${{ github.repository }}"; then OK=1; break; fi
            echo "tentativa $i falhou, repetindo..."; sleep 15
          done
          if [ "$OK" != "1" ]; then echo "::error::Falha ao publicar o release apos varias tentativas"; exit 1; fi
